<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Consumer payments overview</title>
<style>
  :root {
    color-scheme: light;
    --page: #f9f9f7;
    --surface: #fcfcfb;
    --ink: #0b0b0b;
    --ink-2: #52514e;
    --muted: #898781;
    --grid: #e1e0d9;
    --axis: #c3c2b7;
    --border: rgba(11, 11, 11, 0.10);
    --wash: rgba(11, 11, 11, 0.05);
    --neutral-bar: #898781;
    --up: #006300;
    --down: #d03b3b;
    --s1: #2a78d6;
    --s2: #eb6834;
    --s3: #1baf7a;
    --s4: #eda100;
  }
  @media (prefers-color-scheme: dark) {
    :root:where(:not([data-theme="light"])) {
      color-scheme: dark;
      --page: #0d0d0d;
      --surface: #1a1a19;
      --ink: #f0efec;
      --ink-2: #c3c2b7;
      --muted: #898781;
      --grid: #2c2c2a;
      --axis: #383835;
      --border: rgba(255, 255, 255, 0.10);
      --wash: rgba(255, 255, 255, 0.06);
      --neutral-bar: #898781;
      --up: #0ca30c;
      --down: #e66767;
      --s1: #3987e5;
      --s2: #d95926;
      --s3: #199e70;
      --s4: #c98500;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --page: #0d0d0d;
    --surface: #1a1a19;
    --ink: #f0efec;
    --ink-2: #c3c2b7;
    --muted: #898781;
    --grid: #2c2c2a;
    --axis: #383835;
    --border: rgba(255, 255, 255, 0.10);
    --wash: rgba(255, 255, 255, 0.06);
    --neutral-bar: #898781;
    --up: #0ca30c;
    --down: #e66767;
    --s1: #3987e5;
    --s2: #d95926;
    --s3: #199e70;
    --s4: #c98500;
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--page);
    color: var(--ink);
    font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  main { max-width: 1120px; margin: 0 auto; padding: 28px 20px 40px; }
  h1 { font-size: 22px; font-weight: 600; margin: 0 0 2px; }
  h2 { font-size: 15px; font-weight: 600; margin: 0; }
  .sub { color: var(--ink-2); margin: 0; }
  .small { font-size: 12px; color: var(--ink-2); }

  .filters {
    display: flex; flex-wrap: wrap; align-items: end; gap: 12px 20px;
    margin: 20px 0 16px;
  }
  .filters fieldset { border: 0; padding: 0; margin: 0; display: flex; gap: 6px; align-items: center; }
  .filters legend, .filters label { font-size: 12px; color: var(--ink-2); display: block; margin-bottom: 4px; padding: 0; }
  .field { display: flex; flex-direction: column; }
  button, select {
    font: inherit; color: var(--ink); background: var(--surface);
    border: 1px solid var(--border); border-radius: 6px; padding: 6px 10px; min-height: 32px;
  }
  button { cursor: pointer; }
  button:hover { background: var(--wash); }
  button[aria-pressed="true"] { background: var(--ink); color: var(--surface); border-color: var(--ink); }
  button:focus-visible, select:focus-visible, [tabindex]:focus-visible {
    outline: 2px solid var(--s1); outline-offset: 2px;
  }

  .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; margin-bottom: 12px; }
  .card {
    background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 16px;
    position: relative; min-width: 0;
  }
  .tile .label { font-size: 12px; color: var(--ink-2); }
  .tile .value { font-size: 26px; font-weight: 600; line-height: 1.2; margin: 4px 0 2px; }
  .tile .delta { font-size: 12px; color: var(--ink-2); }
  .tile .delta .dir { font-weight: 600; }
  .tile .delta .dir.good { color: var(--up); }
  .tile .delta .dir.bad { color: var(--down); }

  .grid2 { display: grid; grid-template-columns: minmax(0, 3fr) minmax(0, 2fr); gap: 12px; margin-bottom: 12px; }
  @media (max-width: 820px) { .grid2 { grid-template-columns: minmax(0, 1fr); } }
  .card-head { display: flex; justify-content: space-between; align-items: start; gap: 12px; margin-bottom: 10px; }
  .card-head button { font-size: 12px; padding: 4px 8px; min-height: 26px; flex: none; }

  .legend { display: flex; flex-wrap: wrap; gap: 4px 16px; font-size: 12px; color: var(--ink-2); margin-bottom: 6px; min-height: 18px; }
  .legend span { display: inline-flex; align-items: center; gap: 6px; }
  .swatch { width: 10px; height: 10px; border-radius: 2px; display: inline-block; flex: none; }

  svg { display: block; width: 100%; overflow: visible; }
  svg text { font: 11px system-ui, -apple-system, "Segoe UI", sans-serif; fill: var(--muted); }
  svg text.cap { fill: var(--ink); font-weight: 600; }
  .band { fill: transparent; cursor: default; }
  .band:hover, .band:focus { fill: var(--wash); outline: none; }

  .bars { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 14px 12px; align-items: center; margin-top: 8px; }
  .bars .name { color: var(--ink-2); }
  .bars .row { display: contents; }
  .bars .track { display: flex; align-items: center; gap: 8px; min-width: 0; border-radius: 4px; padding: 3px 0; }
  .bars .track:hover, .bars .track:focus { background: var(--wash); outline: none; }
  .bars .bar { height: 16px; border-radius: 0 4px 4px 0; min-width: 2px; flex: none; }
  .bars .val { font-weight: 600; white-space: nowrap; }
  .bars .share { color: var(--ink-2); white-space: nowrap; }
  .dim { opacity: 0.32; }

  table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; }
  caption { text-align: left; font-size: 12px; color: var(--ink-2); padding-bottom: 6px; }
  th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--grid); vertical-align: middle; }
  th { font-size: 12px; font-weight: 600; color: var(--ink-2); }
  td.num, th.num { text-align: right; white-space: nowrap; }
  td.barcell { width: 28%; }
  td.barcell div { height: 8px; border-radius: 0 4px 4px 0; background: var(--neutral-bar); min-width: 2px; }
  tr.note td { color: var(--ink-2); font-size: 12px; }
  .scroll { overflow-x: auto; }
  .empty { color: var(--ink-2); padding: 18px 0; }

  #tip {
    position: fixed; z-index: 10; pointer-events: none; display: none;
    background: var(--surface); color: var(--ink); border: 1px solid var(--border); border-radius: 8px;
    padding: 8px 10px; font-size: 12px; box-shadow: 0 4px 16px rgba(0, 0, 0, 0.14); max-width: 280px;
  }
  #tip .t { font-weight: 600; margin-bottom: 4px; }
  #tip .r { display: flex; align-items: center; gap: 8px; }
  #tip .k { width: 10px; height: 2px; border-radius: 1px; flex: none; }
  #tip .v { font-weight: 600; }
  #tip .l { color: var(--ink-2); }
  #tip .total { border-top: 1px solid var(--grid); margin-top: 4px; padding-top: 4px; }
  footer { margin-top: 18px; }
  footer p { margin: 0 0 4px; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <header>
    <h1>Consumer payments overview</h1>
    <p class="sub" id="subtitle"></p>
  </header>

  <div class="filters" role="group" aria-label="Filters">
    <fieldset>
      <legend>Period</legend>
      <button type="button" data-preset="0-11">Full year</button>
      <button type="button" data-preset="0-2">Q1</button>
      <button type="button" data-preset="3-5">Q2</button>
      <button type="button" data-preset="6-8">Q3</button>
      <button type="button" data-preset="9-11">Q4</button>
    </fieldset>
    <div class="field"><label for="from">From</label><select id="from"></select></div>
    <div class="field"><label for="to">To</label><select id="to"></select></div>
    <div class="field"><label for="type">Payment type</label><select id="type"></select></div>
  </div>

  <section class="tiles" id="tiles" aria-label="Headline figures"></section>

  <div class="grid2">
    <section class="card" aria-labelledby="trend-title">
      <div class="card-head">
        <div><h2 id="trend-title">Payment value by month</h2><p class="small" id="trend-sub"></p></div>
        <button type="button" id="trend-toggle" aria-pressed="false">Table</button>
      </div>
      <div id="trend-chart"><div class="legend" id="trend-legend"></div><div id="trend-svg"></div></div>
      <div id="trend-table" class="scroll" hidden></div>
    </section>

    <section class="card" aria-labelledby="types-title">
      <div class="card-head">
        <div><h2 id="types-title">Payment value by type</h2><p class="small" id="types-sub"></p></div>
        <button type="button" id="types-toggle" aria-pressed="false">Table</button>
      </div>
      <div id="types-chart" class="bars"></div>
      <div id="types-table" class="scroll" hidden></div>
    </section>
  </div>

  <section class="card" aria-labelledby="merch-title">
    <div class="card-head">
      <div><h2 id="merch-title">Top merchants by payment value</h2><p class="small" id="merch-sub"></p></div>
    </div>
    <div id="merchants" class="scroll"></div>
  </section>

  <footer class="small">
    <p id="note-data"></p>
    <p id="note-privacy"></p>
    <p>Payment value counts successful transfers to people, merchant payments, card payments and bill payments. Cash in and cash out are not payments and are left out.</p>
  </footer>
</main>

  function int(x) { return Math.round(x).toLocaleString("en-GB"); }
  function pct(x, d) { return (x * 100).toFixed(d === undefined ? 1 : d) + "%"; }
  function monthLabel(i) { return MONTHS[+DATA.months[i].slice(5) - 1] + " " + DATA.months[i].slice(0, 4); }
  function typesInScope() {
    if (state.type >= 0) return [state.type];
    var all = [];
    for (var t = 0; t < NT; t++) all.push(t);
    return all;
  }
  function periodLabel() {
    return state.from === state.to ? monthLabel(state.from) : monthLabel(state.from) + " to " + monthLabel(state.to);
  }
  function typeLabel() { return state.type < 0 ? "All payment types" : DATA.types[state.type].label; }

  function summarise(from, to) {
    var s = { n: 0, v: 0, a: 0, payers: 0, months: to - from + 1 };
    var ts = typesInScope();
    for (var m = from; m <= to; m++) {
      ts.forEach(function (t) { s.n += cell[m][t].n; s.v += cell[m][t].v; s.a += cell[m][t].a; });
      s.payers += state.type < 0 ? DATA.payers[m] : cell[m][state.type].c;
    }
    s.avg = s.n ? s.v / s.n : 0;
    s.rate = s.a ? s.n / s.a : 0;
    s.payersAvg = s.payers / s.months;
    return s;
  }

  // ---------- tooltip ----------
  var tip = document.getElementById("tip");
  function showTip(target, title, rows, total) {
    clear(tip);
    tip.appendChild(el("div", "t", title));
    rows.forEach(function (r) {
      var row = el("div", "r");
      var key = el("span", "k");
      key.style.background = r.color || "var(--muted)";
      row.appendChild(key);
      row.appendChild(el("span", "v", r.value));
      row.appendChild(el("span", "l", r.label));
      tip.appendChild(row);
    });
    if (total) {
      var tr = el("div", "r total");
      tr.appendChild(el("span", "v", total.value));
      tr.appendChild(el("span", "l", total.label));
      tip.appendChild(tr);
    }
    tip.style.display = "block";
    var box = target.getBoundingClientRect(), tb = tip.getBoundingClientRect();
    var x = box.left + box.width / 2 - tb.width / 2;
    var y = box.top - tb.height - 8;
    if (y < 8) y = Math.min(box.bottom + 8, window.innerHeight - tb.height - 8);
    x = Math.max(8, Math.min(x, window.innerWidth - tb.width - 8));
    tip.style.left = x + "px";
    tip.style.top = y + "px";
  }
  function hideTip() { tip.style.display = "none"; }
  function attachTip(node, build) {
    node.addEventListener("pointerenter", function () { build(node); });
    node.addEventListener("pointerleave", hideTip);
    node.addEventListener("focus", function () { build(node); });
    node.addEventListener("blur", hideTip);
  }

  // ---------- tiles ----------
  function renderTiles() {
    var now = summarise(state.from, state.to);
    var len = state.to - state.from + 1;
    var prev = state.from - len >= 0 ? summarise(state.from - len, state.from - 1) : null;
    var compare = len === 1 ? "vs previous month" : "vs previous " + len + " months";
    var tiles = [
      { label: "Payment value", value: money(now.v), cur: now.v, prev: prev && prev.v },
      { label: "Payments", value: compact(now.n), cur: now.n, prev: prev && prev.n },
      { label: "Average payment", value: moneyFull(now.avg), cur: now.avg, prev: prev && prev.avg },
      { label: "Paying customers, monthly average", value: int(now.payersAvg), cur: now.payersAvg, prev: prev && prev.payersAvg },
      { label: "Payment success rate", value: pct(now.rate), cur: now.rate, prev: prev && prev.rate, points: true }
    ];
    var host = document.getElementById("tiles");
    clear(host);
    tiles.forEach(function (t) {
      var card = el("div", "card tile");
      card.appendChild(el("div", "label", t.label));
      card.appendChild(el("div", "value", t.value));
      var delta = el("div", "delta");
      if (prev && t.prev) {
        var change = t.points ? (t.cur - t.prev) * 100 : (t.cur - t.prev) / t.prev * 100;
        var flat = Math.abs(change) < 0.05;
        var up = change > 0;
        var text = (flat ? "No change" : (up ? "▲ Up " : "▼ Down ") + Math.abs(change).toFixed(1) + (t.points ? " pts" : "%"));
        delta.appendChild(el("span", "dir " + (flat ? "" : up ? "good" : "bad"), text));
        delta.appendChild(document.createTextNode(" " + compare));
      } else {
        delta.textContent = "No earlier period to compare";
      }
      card.appendChild(delta);
      host.appendChild(card);
    });
  }

  // ---------- trend: stacked columns ----------
  function niceMax(x) {
    if (x <= 0) return 1;
    var pow = Math.pow(10, Math.floor(Math.log10(x)));
    var steps = [1, 2, 2.5, 5, 10];
    for (var i = 0; i < steps.length; i++) if (steps[i] * pow >= x) return steps[i] * pow;
    return 10 * pow;
  }
  function renderTrend() {
    var ts = typesInScope();
    document.getElementById("trend-sub").textContent =
      typeLabel() + ". Months outside the selected period are faded.";

    var legend = document.getElementById("trend-legend");
    clear(legend);
    if (ts.length > 1) {
      ts.forEach(function (t) {
        var item = el("span");
        var sw = el("i", "swatch");
        sw.style.background = COLORS[t];
        item.appendChild(sw);
        item.appendChild(document.createTextNode(DATA.types[t].label));
        legend.appendChild(item);
      });
    }

    var host = document.getElementById("trend-svg");
    clear(host);
    var W = Math.max(host.clientWidth || 600, 300), plotH = 220, top = 22, left = 46, right = 8, axisBand = 24;
    var H = top + plotH + axisBand;
    var root = svg("svg", { viewBox: "0 0 " + W + " " + H, height: H, role: "group", "aria-label": "Payment value by month, stacked by payment type" });
    var totals = [];
    for (var m = 0; m < NM; m++) totals.push(ts.reduce(function (s, t) { return s + cell[m][t].v; }, 0));
    var max = niceMax(Math.max.apply(null, totals) / 100);
    var plotW = W - left - right, band = plotW / NM, bw = Math.min(24, band * 0.62);
    var y = function (v) { return top + plotH - (v / 100 / max) * plotH; };

    for (var g = 0; g <= 4; g++) {
      var gv = max * g / 4, gy = top + plotH - (g / 4) * plotH;
      root.appendChild(svg("line", { x1: left, x2: W - right, y1: gy, y2: gy, stroke: g === 0 ? "var(--axis)" : "var(--grid)", "stroke-width": 1 }));
      var lab = svg("text", { x: left - 8, y: gy + 4, "text-anchor": "end" });
      lab.textContent = compact(gv).replace(/\.0+(?=[KMB]?$)/, "");   // 200.0K -> 200K on the axis
      root.appendChild(lab);
    }

    var lastInRange = state.to;
    for (m = 0; m < NM; m++) {
      var inRange = m >= state.from && m <= state.to;
      var cx = left + band * m + band / 2, x0 = cx - bw / 2;
      var group = svg("g", { opacity: inRange ? 1 : 0.28 });
      var base = 0;
      ts.forEach(function (t, i) {
        var v = cell[m][t].v;
        if (v <= 0) return;
        var yTop = y(base + v), yBot = y(base), h = yBot - yTop;
        var isTop = i === ts.length - 1;
        var gap = isTop ? 0 : 2;                      // 2px surface gap between stacked segments
        if (h - gap < 1) { base += v; return; }
        var r = isTop ? Math.min(4, (h - gap) / 2) : 0;
        var d = "M" + x0 + "," + yBot +
                " L" + x0 + "," + (yTop + gap + r) +
                " Q" + x0 + "," + (yTop + gap) + " " + (x0 + r) + "," + (yTop + gap) +
                " L" + (x0 + bw - r) + "," + (yTop + gap) +
                " Q" + (x0 + bw) + "," + (yTop + gap) + " " + (x0 + bw) + "," + (yTop + gap + r) +
                " L" + (x0 + bw) + "," + yBot + " Z";
        group.appendChild(svg("path", { d: d, fill: COLORS[t] }));
        base += v;
      });
      root.appendChild(group);

      var xl = svg("text", { x: cx, y: top + plotH + 16, "text-anchor": "middle", opacity: inRange ? 1 : 0.5 });
      xl.textContent = MONTHS[+DATA.months[m].slice(5) - 1];
      root.appendChild(xl);

      if (m === lastInRange) {
        var cap = svg("text", { x: cx, y: y(totals[m]) - 6, "text-anchor": "middle", "class": "cap" });
        cap.textContent = compact(totals[m] / 100);
        root.appendChild(cap);
      }

      (function (mi) {
        var hit = svg("rect", { x: left + band * mi, y: top, width: band, height: plotH, "class": "band", tabindex: 0, role: "img" });
        var rows = ts.slice().reverse().map(function (t) {
          return { color: COLORS[t], value: moneyFull(cell[mi][t].v), label: DATA.types[t].label };
        });
        hit.setAttribute("aria-label", monthLabel(mi) + ": " + moneyFull(totals[mi]) + " in total. " +
          rows.map(function (r) { return r.label + " " + r.value; }).join(", "));
        attachTip(hit, function (node) {
          showTip(node, monthLabel(mi), rows, ts.length > 1 ? { value: moneyFull(totals[mi]), label: "Total" } : null);
        });
        root.appendChild(hit);
      })(m);
    }
    var unit = svg("text", { x: left - 8, y: 10, "text-anchor": "end" });
    unit.textContent = CUR;
    root.appendChild(unit);
    host.appendChild(root);

    // table twin
    var th = ["Month"].concat(ts.map(function (t) { return DATA.types[t].label; }));
    if (ts.length > 1) th.push("Total");
    var rows = [];
    for (m = state.from; m <= state.to; m++) {
      var r = [monthLabel(m)].concat(ts.map(function (t) { return moneyFull(cell[m][t].v); }));
      if (ts.length > 1) r.push(moneyFull(totals[m]));
      rows.push(r);
    }
    fillTable("trend-table", "Payment value by month, " + periodLabel(), th, rows);
  }

  // ---------- by type: ranked bars ----------
  function renderTypes() {
    document.getElementById("types-sub").textContent = periodLabel() +
      (state.type >= 0 ? ". " + DATA.types[state.type].label + " highlighted." : ".");
    var sums = [];
    for (var t = 0; t < NT; t++) {
      var s = { t: t, n: 0, v: 0 };
      for (var m = state.from; m <= state.to; m++) { s.n += cell[m][t].n; s.v += cell[m][t].v; }
      sums.push(s);
    }
    var total = sums.reduce(function (a, s) { return a + s.v; }, 0);
    var max = Math.max.apply(null, sums.map(function (s) { return s.v; })) || 1;
    var order = sums.slice().sort(function (a, b) { return b.v - a.v; });

    var host = document.getElementById("types-chart");
    clear(host);
    order.forEach(function (s) {
      var dim = state.type >= 0 && state.type !== s.t;
      var row = el("div", "row");
      var name = el("div", "name" + (dim ? " dim" : ""), DATA.types[s.t].label);
      var track = el("div", "track" + (dim ? " dim" : ""));
      track.tabIndex = 0;
      track.setAttribute("role", "img");
      var share = total ? s.v / total : 0;
      track.setAttribute("aria-label", DATA.types[s.t].label + ": " + moneyFull(s.v) + ", " + pct(share, 0) +
        " of payment value, " + int(s.n) + " payments");
      var bar = el("div", "bar");
      bar.style.background = COLORS[s.t];
      bar.style.width = "calc((100% - 112px) * " + (s.v / max).toFixed(4) + ")";
      track.appendChild(bar);
      track.appendChild(el("span", "val", money(s.v)));
      track.appendChild(el("span", "share", pct(share, 0)));
      attachTip(track, function (node) {
        showTip(node, DATA.types[s.t].label, [
          { color: COLORS[s.t], value: moneyFull(s.v), label: "payment value" },
          { color: COLORS[s.t], value: int(s.n), label: "payments" },
          { color: COLORS[s.t], value: pct(share), label: "of all payment value" }
        ]);
      });
      row.appendChild(name);
      row.appendChild(track);
      host.appendChild(row);
    });

    fillTable("types-table", "Payment value by type, " + periodLabel(),
      ["Payment type", "Payments", "Payment value", "Share"],
      order.map(function (s) { return [DATA.types[s.t].label, int(s.n), moneyFull(s.v), pct(total ? s.v / total : 0)]; }));
  }

  // ---------- merchants ----------
  function renderMerchants() {
    var host = document.getElementById("merchants");
    clear(host);
    document.getElementById("merch-sub").textContent = typeLabel() + ", " + periodLabel() + ".";
    var agg = {}, hidden = { n: 0, v: 0 };
    var inScope = function (r) { return r[0] >= state.from && r[0] <= state.to && (state.type < 0 || r[1] === state.type); };
    DATA.merchantCells.forEach(function (r) {
      if (!inScope(r)) return;
      var a = agg[r[2]] || (agg[r[2]] = { id: r[2], n: 0, v: 0 });
      a.n += r[3]; a.v += r[4];
    });
    DATA.suppressed.forEach(function (r) { if (inScope(r)) { hidden.n += r[2]; hidden.v += r[3]; } });
    var list = Object.keys(agg).map(function (k) { return agg[k]; }).sort(function (a, b) { return b.v - a.v || a.id - b.id; });
    if (!list.length) {
      host.appendChild(el("p", "empty", state.type >= 0 && !DATA.types[state.type].merchant
        ? "Transfers between people don't involve a merchant."
        : "No merchant payments in this selection."));
      return;
    }
    var total = list.reduce(function (s, a) { return s + a.v; }, 0) + hidden.v;
    var top = list.slice(0, 10), max = top[0].v;
    var table = el("table");
    table.appendChild(el("caption", "", "Ten largest of " + list.length + " merchants. Share is of all merchant payment value in the selection."));
    var head = el("tr");
    [["#", "num"], ["Merchant", ""], ["Category", ""], ["Payments", "num"], ["Payment value", "num"], ["Share", "num"], ["", ""]]
      .forEach(function (h) { var c = el("th", h[1], h[0]); c.scope = "col"; head.appendChild(c); });
    var thead = el("thead"); thead.appendChild(head); table.appendChild(thead);
    var body = el("tbody");
    top.forEach(function (a, i) {
      var mrow = DATA.merchants[a.id], tr = el("tr");
      tr.appendChild(el("td", "num", String(i + 1)));
      tr.appendChild(el("td", "", mrow.name));
      tr.appendChild(el("td", "", mrow.category));
      tr.appendChild(el("td", "num", int(a.n)));
      tr.appendChild(el("td", "num", moneyFull(a.v)));
      tr.appendChild(el("td", "num", pct(a.v / total)));
      var bc = el("td", "barcell"), b = el("div");
      b.style.width = (a.v / max * 100).toFixed(1) + "%";
      bc.appendChild(b); tr.appendChild(bc);
      body.appendChild(tr);
    });
    var rest = list.slice(10).reduce(function (s, a) { return { n: s.n + a.n, v: s.v + a.v }; }, { n: 0, v: 0 });
    [["All other merchants", rest], ["Not shown: merchant-months with fewer than " + DATA.meta.minCustomers + " customers", hidden]]
      .forEach(function (pair) {
        if (!pair[1].n) return;
        var tr = el("tr", "note");
        tr.appendChild(el("td", "num", ""));
        var label = el("td", "", pair[0]); label.colSpan = 2; tr.appendChild(label);
        tr.appendChild(el("td", "num", int(pair[1].n)));
        tr.appendChild(el("td", "num", moneyFull(pair[1].v)));
        tr.appendChild(el("td", "num", pct(pair[1].v / total)));
        tr.appendChild(el("td", "", ""));
        body.appendChild(tr);
      });
    table.appendChild(body);
    host.appendChild(table);
  }

  // ---------- table twins ----------
  function fillTable(id, caption, headers, rows) {
    var host = document.getElementById(id);
    clear(host);
    var table = el("table");
    table.appendChild(el("caption", "", caption));
    var thead = el("thead"), hr = el("tr");
    headers.forEach(function (h, i) { var c = el("th", i ? "num" : "", h); c.scope = "col"; hr.appendChild(c); });
    thead.appendChild(hr); table.appendChild(thead);
    var body = el("tbody");
    rows.forEach(function (r) {
      var tr = el("tr");
      r.forEach(function (v, i) { tr.appendChild(el("td", i ? "num" : "", v)); });
      body.appendChild(tr);
    });
    table.appendChild(body);
    host.appendChild(table);
  }
  function wireToggle(name) {
    var button = document.getElementById(name + "-toggle");
    button.addEventListener("click", function () {
      var showTable = button.getAttribute("aria-pressed") !== "true";
      button.setAttribute("aria-pressed", String(showTable));
      button.textContent = showTable ? "Chart" : "Table";
      document.getElementById(name + "-table").hidden = !showTable;
      document.getElementById(name + "-chart").hidden = showTable;
      if (!showTable) render();
    });
  }

  // ---------- filters ----------
  var fromSel = document.getElementById("from"), toSel = document.getElementById("to"), typeSel = document.getElementById("type");
  var presets = Array.prototype.slice.call(document.querySelectorAll("[data-preset]"));
  function option(value, text) { var o = el("option", "", text); o.value = value; return o; }
  for (var i = 0; i < NM; i++) { fromSel.appendChild(option(i, monthLabel(i))); toSel.appendChild(option(i, monthLabel(i))); }
  typeSel.appendChild(option(-1, "All payment types"));
  DATA.types.forEach(function (t, idx) { typeSel.appendChild(option(idx, t.label)); });

  function syncControls() {
    fromSel.value = state.from; toSel.value = state.to; typeSel.value = state.type;
    presets.forEach(function (b) {
      b.setAttribute("aria-pressed", String(b.getAttribute("data-preset") === state.from + "-" + state.to));
    });
  }
  presets.forEach(function (b) {
    b.addEventListener("click", function () {
      var p = b.getAttribute("data-preset").split("-");
      state.from = +p[0]; state.to = +p[1]; render();
    });
  });
  fromSel.addEventListener("change", function () { state.from = +fromSel.value; if (state.to < state.from) state.to = state.from; render(); });
  toSel.addEventListener("change", function () { state.to = +toSel.value; if (state.from > state.to) state.from = state.to; render(); });
  typeSel.addEventListener("change", function () { state.type = +typeSel.value; render(); });

  function render() {
    hideTip();
    syncControls();
    renderTiles();
    renderTrend();
    renderTypes();
    renderMerchants();
  }

  document.getElementById("subtitle").textContent = DATA.meta.company + " · " + DATA.meta.year + " · aggregated figures only";
  document.getElementById("note-data").textContent = "Synthetic data for a fictional company. " + DATA.meta.note;
  document.getElementById("note-privacy").textContent =
    "No customer-level rows are in this file. A merchant's month is left out of the ranking when fewer than " +
    DATA.meta.minCustomers + " customers paid there, and shown as one combined line.";
  wireToggle("trend");
  wireToggle("types");
  var resizeTimer;
  window.addEventListener("resize", function () { clearTimeout(resizeTimer); resizeTimer = setTimeout(renderTrend, 120); });
  window.addEventListener("scroll", hideTip, true);
  render();
})();
</script>
</body>
</html>
